name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the tap (for example, v0.10.1)'
        required: true
        type: string
      confirm:
        description: 'Type exactly "update-homebrew-tap" to confirm the external tap mutation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  update-homebrew-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify manual confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_INPUT" = "update-homebrew-tap"

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [[ -z "$tag" ]]; then
            echo "Missing release tag." >&2
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version tag beginning with v." >&2
            exit 1
          fi
          source_repository="openclaw/mcporter"
          release="$(gh api "repos/${source_repository}/releases/tags/${tag}")"
          if [[ "$(jq -r '.draft or .prerelease' <<<"$release")" != "false" ]]; then
            echo "Release must be published and non-prerelease." >&2
            exit 1
          fi
          version="${tag#v}"
          asset="mcporter-${version}.tgz"
          expected_url="https://github.com/${source_repository}/releases/download/${tag}/${asset}"
          asset_json="$(jq -ce --arg name "$asset" --arg url "$expected_url" '
            .assets[] | select(.name == $name and .state == "uploaded" and .browser_download_url == $url)
            | {name, browser_download_url, digest}
          ' <<<"$release")"
          if [[ -z "$asset_json" || "$(jq -r '.digest // empty' <<<"$asset_json")" != sha256:* ]]; then
            echo "Missing immutable published npm artifact or SHA-256 digest for ${asset}." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_repository=$source_repository" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$expected_url" >> "$GITHUB_OUTPUT"
          echo "request_id=mcporter-${tag}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Dispatch tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          # Source releases come from openclaw/mcporter; the active Homebrew tap
          # remains steipete/homebrew-tap until an explicit tap migration is approved.
          gh workflow run update-formula.yml \
            --repo steipete/homebrew-tap \
            -f formula=mcporter \
            -f tag="${{ steps.release.outputs.tag }}" \
            -f repository="${{ steps.release.outputs.source_repository }}" \
            -f artifact_url="${{ steps.release.outputs.artifact_url }}" \
            -f request_id="${{ steps.release.outputs.request_id }}"

      - name: Wait for tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..12}; do
            run_id="$(gh run list --repo steipete/homebrew-tap --workflow update-formula.yml --json databaseId,displayTitle --jq '.[] | select(.displayTitle | contains("${{ steps.release.outputs.request_id }}")) | .databaseId' | head -n1)"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --repo steipete/homebrew-tap --exit-status
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for tap workflow to appear." >&2
          exit 1
